<form class="contact-page" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="contact-hero">
    <h1 class="contact-title">Contacto</h1>
    <p class="contact-subtitle">ESTABLISHING_SECURE_LINK</p>
  </div>

  <div class="contact-grid">
    <div class="contact-info-card">
      <h2 class="contact-card-title">Canales</h2>
      <div class="contact-links">
        <a
          class="contact-link-item"
          href="https://github.com/LondoDev"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-symbols-outlined">code</span>
          <div>
            <strong>GitHub</strong>
            <span>github.com/LondoDev</span>
          </div>
          <span class="contact-link-arrow material-symbols-outlined">arrow_outward</span>
        </a>
        <a
          class="contact-link-item"
          href="https://linkedin.com/in/LondoDev"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="material-symbols-outlined">link</span>
          <div>
            <strong>LinkedIn</strong>
            <span>linkedin.com/in/LondoDev</span>
          </div>
          <span class="contact-link-arrow material-symbols-outlined">arrow_outward</span>
        </a>
        <a class="contact-link-item" href="mailto:contacto@sebastian.dev">
          <span class="material-symbols-outlined">mail</span>
          <div>
            <strong>Email</strong>
            <span>contacto&#64;sebastian.dev</span>
          </div>
          <span class="contact-link-arrow material-symbols-outlined">arrow_outward</span>
        </a>
      </div>
    </div>

    <div class="contact-form-card">
      <h2 class="contact-card-title">Enviar mensaje</h2>

      <div class="contact-field">
        <label class="contact-label" for="name">Nombre</label>
        <input
          id="name"
          type="text"
          class="contact-input"
          formControlName="name"
          placeholder="Tu nombre"
          [attr.aria-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        />
      </div>

      <div class="contact-field">
        <label class="contact-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="contact-input"
          formControlName="email"
          placeholder="tu@email.com"
          [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
      </div>

      <div class="contact-field">
        <label class="contact-label" for="message">Mensaje</label>
        <textarea
          id="message"
          class="contact-input contact-textarea"
          formControlName="message"
          placeholder="¿En qué proyecto querés trabajar?"
          rows="4"
        ></textarea>
      </div>

      <button
        type="submit"
        class="contact-submit"
        [disabled]="form.invalid || form.pristine"
      >
        <span class="material-symbols-outlined">send</span>
        Enviar mensaje
      </button>

      @if (submitted) {
        <p class="contact-success">
          <span class="material-symbols-outlined">check_circle</span>
          Mensaje enviado. ¡Gracias!
        </p>
      }
    </div>
  </div>
</form>
