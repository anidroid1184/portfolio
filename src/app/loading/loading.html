<div class="loom-screen">
  <div class="loom-threads" aria-hidden="true">
    @for (_ of [].constructor(16); track $index) {
      <span class="loom-line" [style.animation-delay.ms]="$index * 100"></span>
    }
  </div>

  <div class="loom-center">
    <p class="loom-brand">jacquard</p>

    <div class="loom-stages">
      @for (stage of stages; track stage.message; let i = $index) {
        <div
          class="loom-stage"
          [class.loom-stage--done]="i < activeStage()"
          [class.loom-stage--live]="i === activeStage()"
        >
          <span class="loom-dot" aria-hidden="true">
            @if (i < activeStage()) {
              <span class="material-symbols-outlined loom-check">check</span>
            }
          </span>
          <span class="loom-msg">{{ stage.message }}</span>
        </div>
      }
    </div>

    <div class="loom-bar-track" aria-hidden="true">
      <div class="loom-bar-fill" [style.transform]="'scaleX(' + (progress() / 100) + ')'"></div>
    </div>

    <button class="loom-skip" (click)="skip()">Skip</button>
  </div>
</div>
