<div class="shell-container">
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="toggleSidebar()" (touchend)="toggleSidebar()" aria-hidden="true"></div>
  }

  <aside
    class="sidebar sidebar-scroll"
    [class.sidebar--collapsed]="!sidebarOpen()"
    aria-label="Barra lateral con información de perfil y redes sociales"
  >
    <section class="sidebar-section border-b border-card-cream/10 bg-card-ink/20">
      <h3 class="section-label">londodev</h3>
      <div class="flex flex-col items-center gap-8">
        <div class="relative group">
          <div class="avatar-container">
            <img [src]="avatarUrl" alt="Foto de perfil de Sebastian" class="avatar-image" />
          </div>
          <div class="status-dot"></div>
        </div>
        <div class="w-full text-center space-y-2">
          <div class="operator-id">Juan Sebastián</div>
          <div class="flex justify-center items-center gap-3">
            <span class="clearance-text">Backend Developer</span>
          </div>
        </div>
      </div>
    </section>

    <section class="sidebar-section border-b border-card-cream/10">
      <h3 class="section-label">PATRONES</h3>
      <nav class="sidebar-nav">
        <a class="sidebar-nav-link" routerLink="/home" routerLinkActive="sidebar-nav-link--active">
          <span class="sidebar-nav-num">01</span>
          <span>Inicio</span>
        </a>
        <a class="sidebar-nav-link" routerLink="/whoami" routerLinkActive="sidebar-nav-link--active">
          <span class="sidebar-nav-num">02</span>
          <span>Quién soy</span>
        </a>
        <a class="sidebar-nav-link" routerLink="/experience" routerLinkActive="sidebar-nav-link--active">
          <span class="sidebar-nav-num">03</span>
          <span>Experiencia</span>
        </a>
        <a class="sidebar-nav-link" routerLink="/contact" routerLinkActive="sidebar-nav-link--active">
          <span class="sidebar-nav-num">04</span>
          <span>Contacto</span>
        </a>
      </nav>
    </section>

    <section class="sidebar-section flex-1">
      <h3 class="section-label">TRAMA</h3>
      <div class="space-y-6 font-printer">
        <div class="space-y-4">
          <a
            class="comms-link"
            href="https://github.com/LondoDev"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="material-symbols-outlined">code</span>
            <span>GitHub</span>
          </a>
          <a
            class="comms-link"
            href="https://linkedin.com/in/LondoDev"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="material-symbols-outlined">link</span>
            <span>LinkedIn</span>
          </a>
        </div>
        <div class="pt-8 border-t border-card-cream/5">
          <a class="emergency-email" href="mailto:contacto@sebastian.dev">contacto&#64;sebastian.dev</a>
        </div>
      </div>
    </section>

    <div class="sidebar-footer">
      <div class="flex items-center gap-3 mb-3">
        <span class="w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></span>
        <span class="text-xs uppercase font-printer">Telar: activo</span>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content">
    <div class="toolbar-top">
      <button
        class="toolbar-btn"
        (click)="toggleSidebar()"
        [attr.aria-label]="i18n.t(sidebarOpen() ? 'toolbar.sidebar.hide' : 'toolbar.sidebar.show')"
        [attr.title]="i18n.t(sidebarOpen() ? 'toolbar.sidebar.hide' : 'toolbar.sidebar.show')"
      >
        <span class="material-symbols-outlined">{{ sidebarOpen() ? 'menu_open' : 'menu' }}</span>
      </button>
      <button
        class="toolbar-btn lang-toggle"
        (click)="toggleLang()"
        [attr.aria-label]="i18n.t(i18n.isEs() ? 'toolbar.lang.en' : 'toolbar.lang.es')"
        [attr.title]="i18n.t(i18n.isEs() ? 'toolbar.lang.en' : 'toolbar.lang.es')"
      >
        <span class="lang-flag">{{ i18n.isEs() ? 'EN' : 'ES' }}</span>
      </button>
    </div>
    <router-outlet />
  </main>

  <app-terminal-bar aria-label="Barra de comandos terminal" />
</div>
