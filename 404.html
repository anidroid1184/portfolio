<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    const segment = window.location.pathname.replace('/portfolio', '').replace('/portfolio/', '') || '/';
    sessionStorage.setItem('redirect', segment);
    window.location.replace('/portfolio/');
  </script>
</head>
<body></body>
</html>
